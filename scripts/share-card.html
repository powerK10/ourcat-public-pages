<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>OurCat share card source</title>
<meta name="robots" content="noindex">
<!-- Source for assets/share.png (1200×630). Render with a headless browser at
     --window-size=1200,630, then check the PNG dimensions. -->
<style>
@font-face{font-family:Lora;src:url('../assets/fonts/Lora-SemiBold.woff2') format('woff2');font-weight:600}
@font-face{font-family:Mulish;src:url('../assets/fonts/Mulish-SemiBold.woff2') format('woff2');font-weight:600}
@font-face{font-family:Mulish;src:url('../assets/fonts/Mulish-Bold.woff2') format('woff2');font-weight:700}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#e8eff8;color:#142647;font-family:Mulish,sans-serif;display:grid;grid-template-columns:430px 1fr;align-items:center;gap:64px;padding:0 80px 0 70px;box-sizing:border-box}
.print{margin:0;padding:12px 12px 0;background:#fff;border:1px solid #b8c6da;border-radius:6px;box-shadow:0 18px 36px #14264722;transform:rotate(-2deg)}
.print img{display:block;width:100%;height:440px;object-fit:cover;object-position:50% 30%;border-radius:2px}
.print p{margin:0;padding:10px 4px 12px;color:#a9491b;font-weight:600;font-size:20px}
.brand{font-family:Lora,serif;font-weight:600;font-size:40px;letter-spacing:-1px;margin:0 0 26px}.brand span{color:#a9491b}
h1{font-family:Lora,serif;font-weight:600;font-size:62px;line-height:1.1;letter-spacing:-1.5px;margin:0 0 26px}
.sub{font-size:28px;line-height:1.4;margin:0;color:#142647}
.pill{display:inline-block;margin-top:28px;padding:12px 22px;border-radius:14px;background:#2468c9;color:#fff;font-weight:700;font-size:24px}
</style>
</head>
<body>
<figure class="print"><img src="../assets/tokyo-wall.jpg" alt=""><p>Tokyo, supervising</p></figure>
<div><p class="brand">OurCat<span>.</span></p><h1>Keep track of your cat’s care, together</h1><p class="sub">Meals, medicine, vet visits, and who did what.</p><span class="pill">Free early access · by invitation</span></div>
</body>
</html>
